<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Josh McGary Archive" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./docent-icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=132" />
  <title>Josh McGary — Archive</title>
  <script>
    (() => {
      const path = location.pathname.replace(/\/{2,}/g, '/');
      if (location.hostname.replace(/^www\./, '') !== 'joshmcgary.com' || path === '/') return;
      const archiveRoutes = /^\/(?:api|assets|channels|data|preview-media|preview-shards|vendor)(?:\/|$)|^\/(?:app\.js|styles\.css|sw\.js|video-feed\.json|manifest\.webmanifest|docent-icon-\d+\.png)$/;
      if (archiveRoutes.test(path)) return;
      location.replace(`https://joshmcgarycom.wordpress.com${path}${location.search}${location.hash}`);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <input id="package-input" type="file" accept="application/json,.json" hidden />
  <script type="module" src="./app.js?v=169"></script>
</body>
</html>
